<style>
  :root{
    --forest-deep:#00837E; --forest-mid:#0C5C57; --moss:#2FA39C; --sun:#F1CA9C;
    --bark:#C99568; --parchment:#FFFCF7; --parchment-dim:#EAF3F2; --ink:#1C3532;
    --ink-soft:#5C726F; --coral:#C1652F; --sky:#2FA39C; --plum:#7A5C3E; --rose:#E3A857;
    --gold:#D68A4C; --teal:#00A69C; --sage:#6B8F47; --ruby:#C4527A;
    --shadow: 0 6px 0 rgba(0,131,126,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 8%, rgba(241,202,156,0.30), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(0,131,126,0.20), transparent 45%),
      radial-gradient(circle at 92% 12%, rgba(193,101,47,0.12), transparent 40%),
      radial-gradient(circle at 8% 85%, rgba(47,163,156,0.16), transparent 40%),
      var(--parchment);
    font-family:'Nunito', sans-serif; color:var(--ink);
    display:flex;justify-content:center; padding:18px 12px 40px;
  }
  h1,h2,.display{font-family:'Baloo 2', sans-serif; font-weight:700;}
  h3{font-family:'Fredoka', sans-serif;}
  .app{width:100%;max-width:480px;}

  .brand-header{text-align:center;margin-bottom:12px;}
  .brand-logo{
    width:76px;height:76px;border-radius:50%;object-fit:cover;
    box-shadow:0 8px 0 rgba(0,90,86,0.25), 0 0 0 4px #fff, 0 0 0 6px var(--forest-deep);
  }
  .brand-tagline{
    font-family:'Caveat', cursive;font-weight:700;font-size:20px;color:var(--bark);
    margin-top:4px;letter-spacing:.3px;
  }
  .hud{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .hud button{
    width:38px;height:38px;border-radius:50%;border:none;
    background:var(--forest-deep);color:var(--parchment);font-size:18px;cursor:pointer;
    box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;flex:none;
  }
  .hud button:disabled{opacity:.35;cursor:default;box-shadow:none;}
  .hud .title-pill{
    flex:1;text-align:center;background:var(--forest-mid);color:var(--parchment);
    font-family:'Fredoka';font-weight:600;font-size:14px;padding:8px 10px;border-radius:20px;
    box-shadow:var(--shadow);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .xp-pill{
    background:var(--sun);color:var(--forest-deep);font-family:'Fredoka';font-weight:600;
    padding:8px 12px;border-radius:20px;box-shadow:0 6px 0 rgba(153,100,50,0.4);
    font-size:13.5px;display:flex;align-items:center;gap:5px;flex:none;
    transition:transform .15s;
  }
  .xp-pill.pulse{transform:scale(1.14);}

  .pill-btn{
    font-family:'Fredoka';font-weight:600;font-size:13.5px;border:none;border-radius:18px;
    padding:9px 18px;cursor:pointer;background:var(--parchment-dim);color:var(--ink);box-shadow:var(--shadow);
  }
  .pill-btn.primary{background:var(--coral);color:var(--parchment);box-shadow:0 6px 0 #8F441C;}
  .pill-btn:disabled{opacity:.4;cursor:default;}
  .msg{min-height:18px;font-size:12.5px;color:var(--coral);font-weight:700;text-align:center;}

  /* level badge */
  .level-card{
    display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:12px 14px;
    box-shadow:var(--shadow);margin-bottom:14px;
  }
  .level-card .emoji{font-size:30px;}
  .level-card .info{flex:1;}
  .level-card .info b{font-family:'Baloo 2';font-weight:700;color:var(--forest-deep);font-size:17px;}
  .level-card .bar{background:var(--parchment-dim);border-radius:6px;height:8px;margin-top:5px;overflow:hidden;}
  .level-card .bar-fill{background:var(--moss);height:100%;border-radius:6px;transition:width .3s;}
  .level-card small{color:var(--ink-soft);font-size:11px;}

  /* tier selector */
  .tier-select{display:flex;gap:6px;margin-bottom:16px;}
  .tier-btn{
    flex:1;font-family:'Fredoka';font-weight:600;font-size:12.5px;padding:9px 4px;border-radius:12px;
    border:2px solid var(--parchment-dim);background:var(--parchment-dim);color:var(--ink-soft);cursor:pointer;
  }
  .tier-btn.active{background:var(--forest-mid);border-color:var(--forest-mid);color:#fff;}

  .hub-title{text-align:center;margin-bottom:2px;}
  .hub-title h1{margin:0;font-size:31px;color:var(--forest-deep);letter-spacing:-.3px;}
  .hub-title p{margin:4px 0 16px;color:var(--ink-soft);font-size:13px;text-align:center;}
  .station-grid{display:flex;flex-direction:column;gap:11px;}
  .station-card{
    display:flex;align-items:center;gap:13px;background:#fff;border-radius:18px;
    padding:13px 15px;box-shadow:var(--shadow);border:none;cursor:pointer;text-align:left;width:100%;
  }
  .station-card .icon{
    width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;
    font-size:22px;flex:none;
  }
  .station-card .info{flex:1;min-width:0;}
  .station-card .info h3{margin:0 0 1px;font-size:15px;color:var(--forest-deep);}
  .station-card .info p{margin:0;font-size:11.5px;color:var(--ink-soft);}
  .station-card .tag{
    display:inline-block;margin-top:5px;font-size:9.5px;font-weight:800;letter-spacing:.4px;
    background:var(--parchment-dim);color:var(--ink-soft);padding:2px 7px;border-radius:8px;text-transform:uppercase;
  }
  .station-card .chev{font-size:20px;color:var(--ink-soft);flex:none;}

  .subtitle{margin:4px 0 0;color:var(--ink-soft);font-size:13px;text-align:center;}

  /* word wheel */
  .board{margin:14px 0 8px;display:flex;flex-direction:column;gap:8px;}
  .word-row{display:flex;justify-content:center;gap:5px;padding:2px 0;}
  .tile{
    width:27px;height:33px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    font-family:'Fredoka';font-weight:600;font-size:14.5px;background:var(--parchment-dim);
    border:2px solid rgba(38,48,31,0.12);color:transparent;transition:transform .25s cubic-bezier(.34,1.56,.64,1);
  }
  .word-row.solved .tile{background:var(--forest-mid);border-color:var(--forest-mid);color:var(--parchment);}
  .word-row.solved .tile.pop{animation:pop .35s ease;}
  .word-row.bonus.solved .tile{background:var(--sun);border-color:var(--bark);color:var(--forest-deep);}
  @keyframes pop{0%{transform:scale(.4) rotate(-8deg);}60%{transform:scale(1.15) rotate(4deg);}100%{transform:scale(1) rotate(0);}}
  .shake{animation:shake .35s;}
  .wheel-bonus-emoji{text-align:center;font-size:34px;margin-top:4px;animation:pop .4s ease;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}

  .attempt-row{display:flex;flex-direction:column;align-items:center;gap:9px;margin:14px 0 6px;min-height:60px;}
  .attempt-tiles{display:flex;gap:6px;min-height:44px;align-items:center;flex-wrap:wrap;justify-content:center;}
  .attempt-tile{
    min-width:36px;height:42px;padding:0 4px;border-radius:9px;background:var(--forest-deep);
    color:var(--parchment);display:flex;align-items:center;justify-content:center;
    font-family:'Fredoka';font-weight:600;font-size:18px;cursor:pointer;
    box-shadow:0 4px 0 rgba(0,90,86,0.45);
  }
  .attempt-actions{display:flex;gap:10px;}

  .wheel-wrap{position:relative;width:220px;height:220px;margin:6px auto 4px;}
  .wheel-bg{
    position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ffffff30, transparent 60%), var(--forest-mid);
    box-shadow: inset 0 0 0 6px rgba(255,252,247,0.4), 0 10px 0 rgba(6,50,47,0.3);
  }
  .wheel-center{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:46px;height:46px;border-radius:50%;border:none;background:var(--parchment);
    color:var(--forest-deep);font-size:18px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,0.15);
  }
  .letter-tile{
    position:absolute;width:46px;height:46px;border-radius:50%;background:var(--sun);
    border:3px solid var(--parchment);color:var(--forest-deep);font-family:'Baloo 2';font-weight:700;
    font-size:19px;display:flex;align-items:center;justify-content:center;cursor:pointer;
    box-shadow:0 4px 0 rgba(153,100,50,0.4);transition:transform .15s, opacity .15s;user-select:none;
  }
  .letter-tile.used{opacity:0;pointer-events:none;transform:scale(.4);}
  .tools{display:flex;justify-content:center;gap:8px;margin-top:14px;flex-wrap:wrap;}

  /* grammar */
  .quiz-progress{display:flex;gap:4px;margin:12px 0 16px;}
  .quiz-progress .seg{flex:1;height:6px;border-radius:3px;background:var(--parchment-dim);}
  .quiz-progress .seg.done{background:var(--forest-mid);}
  .quiz-progress .seg.current{background:var(--sun);}
  .quiz-card{background:#fff;border-radius:18px;padding:18px 16px;box-shadow:var(--shadow);text-align:center;}
  .quiz-card .qtext{font-family:'Fredoka';font-size:16.5px;color:var(--forest-deep);margin:0 0 14px;line-height:1.4;}
  .options{display:flex;flex-direction:column;gap:8px;}
  .option-btn{
    font-family:'Nunito';font-weight:700;font-size:14px;padding:11px 13px;border-radius:12px;
    border:2px solid var(--parchment-dim);background:var(--parchment-dim);cursor:pointer;text-align:left;
    color:var(--ink);transition:all .15s;
  }
  .option-btn.correct{background:var(--forest-mid);border-color:var(--forest-mid);color:#fff;}
  .option-btn.wrong{background:#F3D6CC;border-color:var(--coral);color:#8a3016;}
  .option-btn:disabled{cursor:default;}
  .explain{margin-top:12px;background:var(--parchment-dim);border-radius:12px;padding:11px 13px;font-size:12.5px;color:var(--ink-soft);text-align:left;display:none;}
  .explain.show{display:block;}
  .quiz-footer{margin-top:14px;display:flex;justify-content:center;}

  /* scramble */
  .scramble-target{
    background:#fff;border-radius:16px;padding:14px;min-height:60px;margin:14px 0 10px;
    display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start;box-shadow:var(--shadow);
  }
  .scramble-target.empty::before{content:"Tap the words below in order";color:var(--ink-soft);font-size:13px;font-style:italic;}
  .chip{font-family:'Fredoka';font-weight:600;font-size:14px;padding:8px 13px;border-radius:20px;cursor:pointer;user-select:none;transition:transform .12s;}
  .chip.answer{background:var(--forest-deep);color:var(--parchment);box-shadow:0 3px 0 rgba(0,90,86,0.45);}
  .chip.pool{background:var(--sun);color:var(--forest-deep);box-shadow:0 3px 0 rgba(153,100,50,0.35);}
  .pool-wrap{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:12px 0;min-height:40px;}
  .scramble-actions{display:flex;justify-content:center;gap:10px;margin-top:6px;}

  /* match */
  .match-stats{display:flex;justify-content:center;gap:16px;margin:12px 0;font-family:'Fredoka';font-size:13px;color:var(--ink-soft);}
  .memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
  .memory-card{
    aspect-ratio:1/1;border-radius:12px;background:var(--forest-mid);display:flex;align-items:center;justify-content:center;
    font-family:'Fredoka';font-weight:600;font-size:11.5px;color:transparent;cursor:pointer;text-align:center;padding:4px;
    box-shadow:0 4px 0 rgba(6,50,47,0.35);transition:transform .15s;
  }
  .memory-card.flipped{background:var(--sun);color:var(--forest-deep);}
  .memory-card.matched{background:var(--parchment-dim);color:var(--forest-mid);box-shadow:none;cursor:default;}
  .memory-card.wrong{animation:shake .3s;}

  /* describe */
  .scene-card{background:#fff;border-radius:18px;padding:18px;box-shadow:var(--shadow);text-align:center;margin:14px 0;}
  .scene-card h2{margin:0 0 6px;color:var(--forest-deep);font-size:22px;letter-spacing:-.2px;}
  .scene-emoji{font-size:48px;line-height:1;margin-bottom:4px;}
  .scene-card .vocab{color:var(--forest-mid);font-weight:700;font-size:12.5px;margin-bottom:14px;}
  .task-box{background:var(--parchment-dim);border-radius:12px;padding:12px 14px;font-size:14px;font-family:'Fredoka';color:var(--ink);margin-bottom:8px;}
  .mode-toggle{display:flex;gap:6px;justify-content:center;margin:10px 0;}
  .mode-btn{flex:1;max-width:140px;font-family:'Fredoka';font-weight:600;font-size:12.5px;padding:8px;border-radius:12px;border:2px solid var(--parchment-dim);background:var(--parchment-dim);color:var(--ink-soft);cursor:pointer;}
  .mode-btn.active{background:var(--coral);border-color:var(--coral);color:#fff;}
  .timer-box{text-align:center;font-family:'Baloo 2';font-weight:700;font-size:32px;color:var(--forest-deep);margin:10px 0;}
  textarea.write-box{
    width:100%;min-height:100px;border-radius:12px;border:2px solid var(--parchment-dim);padding:10px;
    font-family:'Nunito';font-size:14px;resize:vertical;
  }
  .word-count{text-align:right;font-size:11.5px;color:var(--ink-soft);margin-top:3px;}
  .checklist{display:flex;flex-direction:column;gap:8px;margin:14px 0;}
  .checklist label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink);background:#fff;border-radius:10px;padding:9px 11px;box-shadow:var(--shadow);}
  .checklist input{width:17px;height:17px;}

  /* recall */
  .flashcard{
    background:#fff;border-radius:20px;padding:34px 18px;text-align:center;box-shadow:var(--shadow);margin:16px 0;
    min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .flashcard .word{font-family:'Baloo 2';font-weight:700;font-size:29px;color:var(--forest-deep);letter-spacing:.3px;}
  .word-emoji-big{font-size:52px;margin-bottom:8px;line-height:1;}
  .flashcard .def{font-size:14px;color:var(--ink-soft);margin-top:10px;display:none;}
  .flashcard .def.show{display:block;}
  .rate-row{display:flex;gap:10px;justify-content:center;margin-top:6px;}
  .rate-btn{flex:1;max-width:170px;font-family:'Fredoka';font-weight:600;font-size:13px;padding:11px;border-radius:14px;border:none;cursor:pointer;}
  .rate-btn.no{background:#F3D6CC;color:#8a3016;}
  .rate-btn.yes{background:var(--forest-mid);color:#fff;}
  .recall-stats{text-align:center;font-size:12.5px;color:var(--ink-soft);margin-top:10px;}

  /* reading */
  .passage-card{background:#fff;border-radius:16px;padding:16px;box-shadow:var(--shadow);font-size:14px;line-height:1.55;margin:14px 0;}
  .rq-question{margin:14px 0 4px;font-family:'Fredoka';font-size:14px;color:var(--forest-deep);}

  /* word groups */
  .cat-row{display:flex;gap:8px;margin:14px 0;}
  .cat-btn{
    flex:1;background:#fff;border:2px solid var(--parchment-dim);border-radius:14px;padding:10px 6px;
    text-align:center;cursor:pointer;box-shadow:var(--shadow);
  }
  .cat-btn .cat-name{font-family:'Fredoka';font-weight:600;font-size:12.5px;color:var(--forest-deep);}
  .cat-btn .cat-progress{font-size:11px;color:var(--ink-soft);margin-top:2px;}
  .cat-btn.armed{border-color:var(--sun);background:var(--parchment-dim);}
  .cat-btn.done{opacity:.5;cursor:default;}
  .cat-btn.wrong-shake{animation:shake .35s;}
  .word-pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0;}
  .word-card{
    font-family:'Fredoka';font-weight:600;font-size:13.5px;padding:10px 15px;border-radius:14px;
    background:var(--parchment-dim);color:var(--ink);cursor:pointer;box-shadow:0 3px 0 rgba(0,90,86,0.12);
    transition:transform .12s;
  }
  .word-card.selected{background:var(--forest-deep);color:var(--parchment);box-shadow:0 3px 0 rgba(0,90,86,0.45);}

  /* daily mix */
  .daily-progress{display:flex;gap:5px;margin:14px 0 4px;}
  .daily-progress .seg{flex:1;height:7px;border-radius:4px;background:var(--parchment-dim);}
  .daily-progress .seg.done{background:var(--ruby);}
  .daily-progress .seg.current{background:var(--sun);}
  .daily-label{text-align:center;font-family:'Fredoka';font-weight:600;font-size:12.5px;color:var(--ruby);margin-bottom:10px;}
  .daily-card{background:#fff;border-radius:18px;padding:18px;box-shadow:var(--shadow);}
  .streak-pill{
    display:inline-flex;align-items:center;gap:5px;background:var(--ruby);color:#fff;font-family:'Fredoka';
    font-weight:600;font-size:12.5px;padding:6px 12px;border-radius:14px;margin:0 auto 12px;
  }
  .streak-row{text-align:center;}
  .daily-done{text-align:center;padding:30px 10px;}
  .daily-done .big-emoji{font-size:52px;margin-bottom:10px;}

  /* year plan */
  .year-btn{width:100%;margin-bottom:14px;}
  .year-list{display:flex;flex-direction:column;gap:8px;margin-bottom:6px;}
  .week-card{
    display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:10px 12px;
    box-shadow:var(--shadow);cursor:pointer;text-align:left;border:none;width:100%;
  }
  .week-card .week-num{
    font-family:'Baloo 2';font-weight:700;font-size:15px;color:#fff;background:var(--forest-deep);
    width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;
  }
  .week-card .week-info{flex:1;min-width:0;}
  .week-card .week-info b{font-family:'Fredoka';font-size:13px;color:var(--forest-deep);display:block;}
  .week-card .week-info span{font-size:11px;color:var(--ink-soft);}
  .week-card .week-tier{
    font-size:9.5px;font-weight:800;padding:3px 8px;border-radius:8px;background:var(--parchment-dim);
    color:var(--ink-soft);text-transform:uppercase;flex:none;
  }
  .word-emoji{display:block;font-size:20px;margin-bottom:2px;}
  .icon-img{
    display:block;width:56px;height:56px;margin:0 auto 4px;
    animation:iconPop .4s cubic-bezier(.34,1.56,.64,1);
  }
  .word-card.selected .icon-img{animation:iconWiggle .45s ease;}
  .icon-img-big{
    display:block;width:100px;height:100px;margin:0 auto 8px;
    animation:iconPop .45s cubic-bezier(.34,1.56,.64,1), iconFloat 2.6s ease-in-out .45s infinite;
  }
  @keyframes iconPop{
    0%{transform:scale(.35) rotate(-10deg);opacity:0;}
    70%{transform:scale(1.12) rotate(3deg);opacity:1;}
    100%{transform:scale(1) rotate(0);opacity:1;}
  }
  @keyframes iconWiggle{
    0%,100%{transform:rotate(0) scale(1);}
    25%{transform:rotate(-9deg) scale(1.08);}
    75%{transform:rotate(9deg) scale(1.08);}
  }
  @keyframes iconFloat{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-7px);}
  }

  /* toast */
  .toast{
    position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-40px);
    background:var(--forest-deep);color:var(--parchment);font-family:'Fredoka';font-weight:600;font-size:13px;
    padding:10px 18px;border-radius:20px;box-shadow:0 6px 20px rgba(0,0,0,0.25);opacity:0;transition:all .3s;z-index:50;
    white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .tip-banner{
    display:flex;align-items:center;gap:8px;background:#fff;border:2px dashed var(--forest-mid);
    border-radius:14px;padding:10px 12px;font-size:12.5px;color:var(--ink);margin:0 0 14px;line-height:1.4;
  }
  .tip-banner .tip-close{
    margin-left:auto;background:none;border:none;color:var(--ink-soft);font-size:16px;cursor:pointer;
    line-height:1;padding:0 2px;flex:none;
  }
  .confetti-piece{
    position:fixed;top:-20px;font-size:22px;pointer-events:none;z-index:60;
    animation:confetti-fall 1.6s ease-in forwards;
  }
  @keyframes confetti-fall{
    0%{transform:translateY(0) rotate(0deg);opacity:1;}
    100%{transform:translateY(110vh) rotate(360deg);opacity:0;}
  }
  footer.credit{text-align:center;color:var(--ink-soft);font-size:11px;margin-top:22px;opacity:.7;}
  @media (max-width:360px){ .wheel-wrap{width:200px;height:200px;} .memory-grid{gap:5px;} }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   SHARED STATE
========================================================= */
const TIERS = ['Beginner','Intermediate','Advanced'];
const LEVELS_META = [
  {name:'Seed', icon:'🌱', min:0},
  {name:'Sprout', icon:'🌿', min:150},
  {name:'Sapling', icon:'🌳', min:400},
  {name:'Young Tree', icon:'🌲', min:800},
  {name:'Elder Oak', icon:'🌳✨', min:1500},
];

const state = {
  screen: 'hub',
  tier: 'Beginner',
  xp: 0,
  stationXP: {wheel:0, grammar:0, scramble:0, match:0, describe:0, recall:0, reading:0, groups:0, daily:0},
  wheel:   { levelIndex: 0 },
  grammar: { qIndex: 0, order: [], tier: null },
  scramble:{ sIndex: 0, order: [], answer: [], pool: [], tier: null },
  match:   { cards: [], flipped: [], matched: new Set(), moves: 0 },
  describe:{ mode:'speak', scene:null, task:null, timeLeft:0, timerId:null },
  recall:  { queue: [], mastered: 0 },
  reading: { pIndex: 0, answers: [null,null,null], checked:false },
  groups: { tier:null, cats:[], pool:[], selectedId:null, moves:0 },
  daily: { date:null, tier:null, stepIndex:0, items:null, streak:0, xpEarnedToday:0, gAnswered:false, gSelected:null, scAnswer:[], scPool:[], catSelected:null, catAnswered:false, flipShown:false, done:false },
  showYearPlan: false,
  dismissedTips: new Set(),
};
let lastLevelName = null;

const app = document.getElementById('app');
const el = id => document.getElementById(id);
function goHub(){
  if(state.describe.timerId){ clearInterval(state.describe.timerId); state.describe.timerId = null; }
  state.screen='hub'; render();
}
function shuffledIndices(n){
  const arr=[...Array(n).keys()];
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  return arr;
}
function shuffle(arr){ return [...arr].sort(()=>Math.random()-0.5); }
function addXP(station, n){
  state.xp += n;
  state.stationXP[station] += n;
  const pill = document.querySelector('.xp-pill');
  if(pill){
    pill.textContent = `🌰 ${state.xp} XP`;
    pill.classList.add('pulse');
    setTimeout(()=> pill.classList.remove('pulse'), 220);
  }
}
let toastTimer=null;
function showToast(text){
  const t = el('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 2200);
}
const TIP_TEXT = {
  hub: "New to WordWoods Trail? Pick a level for your class, then choose any station — everything loops endlessly, so it's great for warm-ups, station rotations, or homework at any age or level.",
  wheel: "Tap letters (or type on a keyboard) to spell a word, then hit Check. Find every word in a level to loop into a fresh one.",
  grammar: "Pick the option that completes the sentence correctly. You'll see why right after you answer, then move to the next question.",
  scramble: "Tap the scrambled words in the correct order to rebuild the sentence, then hit Check sentence.",
  match: "Flip two cards at a time and look for words that mean the same thing. Fewer moves earns more stars.",
  describe: "Choose Speak or Write, then use the prompt with a partner, a small group, or on your own — tick the checklist when you're done.",
  recall: "Try to recall the meaning before flipping the card. Rate yourself honestly so tricky words come back around sooner.",
  reading: "Read the passage, answer all three questions, then hit Check answers to see your score.",
  groups: "Tap a word, then tap the category it belongs to. Get all the words sorted to load a fresh set of categories.",
  daily: "Four quick tasks pulled from grammar, sentences, categories, and memory — a new mix every day. Great as a 5-minute warm-up.",
};
function tipBanner(id){
  if(state.dismissedTips.has(id)) return '';
  return `<div class="tip-banner" data-tip="${id}"><span>💡</span><span>${TIP_TEXT[id]}</span><button class="tip-close" data-tip-close="${id}">×</button></div>`;
}
function attachTipBanner(){
  document.querySelectorAll('[data-tip-close]').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.dismissedTips.add(btn.dataset.tipClose); render(); });
  });
}
const CONFETTI_EMOJI = ['🎉','🌟','🍃','✨','🌈','🎊'];
function fireConfetti(){
  for(let i=0;i<14;i++){
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.textContent = CONFETTI_EMOJI[Math.floor(Math.random()*CONFETTI_EMOJI.length)];
    piece.style.left = Math.random()*100+'vw';
    piece.style.animationDelay = (Math.random()*0.4)+'s';
    piece.style.fontSize = (16+Math.random()*14)+'px';
    document.body.appendChild(piece);
    setTimeout(()=> piece.remove(), 2200);
  }
}
function levelInfo(xp){
  let cur = LEVELS_META[0], next = LEVELS_META[1] || null;
  for(let i=0;i<LEVELS_META.length;i++){
    if(xp >= LEVELS_META[i].min){ cur = LEVELS_META[i]; next = LEVELS_META[i+1] || null; }
  }
  return {cur, next};
}

/* =========================================================
   HUB
========================================================= */
const STATIONS = [
  {id:'wheel',   name:'Word Wheel',       desc:'Build vocabulary from a ring of letters', icon:'🌰', bg:'var(--forest-mid)', tag:'Vocabulary'},
  {id:'grammar', name:'Grammar Gauntlet', desc:'Fix the sentence, learn the rule',        icon:'🛠️', bg:'var(--coral)', tag:'Grammar'},
  {id:'scramble',name:'Sentence Scramble',desc:'Put scrambled words in the right order',  icon:'🧩', bg:'var(--sky)', tag:'Sentence order'},
  {id:'match',   name:'Synonym Match',    desc:'Flip cards, pair words that mean the same', icon:'🃏', bg:'var(--plum)', tag:'Meaning'},
  {id:'describe',name:'Describe It',      desc:'Speak or write about a scene, on the spot', icon:'🎤', bg:'var(--rose)', tag:'Speaking & writing'},
  {id:'recall',  name:'Flash Recall',     desc:'Flip flashcards, rate what you remember', icon:'🧠', bg:'var(--gold)', tag:'Memory'},
  {id:'reading', name:'Reading Quest',    desc:'Read a passage, answer the questions',    icon:'📖', bg:'var(--teal)', tag:'Reading'},
  {id:'groups',  name:'Word Groups',      desc:'Sort words into the category they belong to', icon:'🗂️', bg:'var(--sage)', tag:'Categorization'},
  {id:'daily',   name:'Daily Mix',        desc:'A short 4-part mixed warm-up, new every day', icon:'🎯', bg:'var(--ruby)', tag:'Mixed review'},
];

function weekPlan(weekNum){
  const tierIdx = Math.min(Math.floor((weekNum-1)/12), 2);
  const tier = TIERS[tierIdx];
  const weekInTier = (weekNum-1) % 12;
  const cats = GROUPS_BY_TIER[tier];
  const cat = cats[weekInTier % cats.length];
  const gramPool = GRAMMAR.filter(g=>g.tier===tier);
  const gram = gramPool[weekInTier % gramPool.length];
  return {weekNum, tier, category: cat.name, grammarFocus: gram.q.replace('___','...')};
}
function renderYearPlanList(){
  let out = `<p class="subtitle" style="margin-bottom:12px;">Tap a week to set the tier selector to match. 12 weeks per level — roughly one school year at a steady pace. Scroll down for Intermediate and Advanced.</p>`;
  TIERS.forEach((tier, ti) => {
    const startWeek = ti*12 + 1;
    out += `<h3 style="color:var(--forest-deep);margin:14px 0 6px;">${tier} — Weeks ${startWeek}-${startWeek+11}</h3><div class="year-list">`;
    for(let w=startWeek; w<=startWeek+11; w++){
      const p = weekPlan(w);
      out += `
        <button class="week-card" data-week="${w}" data-tier="${p.tier}">
          <div class="week-num">${w}</div>
          <div class="week-info">
            <b>${p.category} &bull; grammar: ${p.grammarFocus}</b>
            <span>Word Groups + Grammar Gauntlet + Describe It</span>
          </div>
          <div class="week-tier">${p.tier}</div>
        </button>`;
    }
    out += `</div>`;
  });
  return out;
}

            <span class="tag">${s.tag} · ${state.stationXP[s.id]} XP</span>
          </div>
          <div class="chev">›</div>
        </button>
      `).join('')}
    </div>
    <footer class="credit">Every station loops endlessly — great for mixed-level classes and repeat practice. Progress resets if you close the file.<br>A Mentalness experience 🌿</footer>
  `;
  document.querySelectorAll('.tier-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.tier = btn.dataset.t; render(); });
  });
  el('yearPlanBtn').addEventListener('click', ()=>{ state.showYearPlan = !state.showYearPlan; render(); });
  if(state.showYearPlan){
    document.querySelectorAll('.week-card').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        state.tier = btn.dataset.tier;
        showToast(`📅 Week ${btn.dataset.week} loaded — tier set to ${btn.dataset.tier}`);
        render();
      });
    });
  }
  document.querySelectorAll('.station-card').forEach(btn=>{
    btn.addEventListener('click', ()=>{ state.screen = btn.dataset.id; render(); });
  });
  attachTipBanner();
  if(leveledUp){ fireConfetti(); showToast(`${cur.icon} Level up! You're now a ${cur.name}`); }
  lastLevelName = cur.name;
}

/* =========================================================
   1) WORD WHEEL (tiered, endless)
========================================================= */
const WHEEL_BY_TIER = {
  Beginner: [
    {letters:"EARTH", words:["EAR","ART","HAT","HEAR","HATE","RATE","TEAR","HARE","HEART"]},
    {letters:"STONE", words:["TEN","SON","TOE","NOTE","TONE","NEST","ONES","NOSE","STONE"]},
    {letters:"CHAIRS", words:["SIR","HAIR","CHAR","CARS","ARCS","RASH","SCAR","CHAIR","HAIRS","CHAIRS"]},
    {letters:"MOTHER", words:["TOE","HOT","HER","THE","HOME","MORE","HERO","THEM","OTHER","MOTHER"]},
  ],
  Intermediate: [
    {letters:"GARDEN", words:["DEAR","DARE","READ","RAGE","GEAR","NEAR","GRAND","RANGE","ANGER","DANGER"]},
    {letters:"CLOUDS", words:["COLD","LOUD","SOLD","CLOD","CODS","COULD","SCOLD","CLOUDS"]},
    {letters:"FRIEND", words:["RID","FED","FIND","FINE","RIDE","DINE","FERN","FRIED","FRIEND"]},
    {letters:"BREADS", words:["BEAR","BEAD","DEAR","DARE","READ","BARS","BARE","BREAD","BREADS"]},
  ],
  Advanced: [
    {letters:"LISTEN", words:["TIN","NET","TEN","LINE","LENS","TILE","ISLE","LISTEN","SILENT"]},
    {letters:"PLANET", words:["LEAP","PLAN","NEAT","LATE","TALE","PLANT","PLATE","PLEAT","PLANET"]},
    {letters:"TRAINS", words:["SAT","RAT","TAN","RAIN","STAR","RANT","STAIN","SAINT","TRAINS","STRAIN"]},
    {letters:"WINTER", words:["WIT","TIN","TEN","WINE","WIRE","WENT","TIER","TIRE","TWINE","WINTER"]},
  ],
};
Object.values(WHEEL_BY_TIER).flat().forEach(l => l.words.sort((a,b)=>a.length-b.length || a.localeCompare(b)));
const WHEEL_HINTS = 3;
let wheelRun = null; // per-level runtime state, rebuilt on entry/tier change/loop

function currentWheelLevels(){ return WHEEL_BY_TIER[state.tier]; }
function newWheelRun(idx){
  const lvl = currentWheelLevels()[idx];
  return { found:new Set(), revealed:{}, hintsLeft:WHEEL_HINTS, hintsUsed:0, pointsEarned:0,
           wheelOrder: shuffledIndices(lvl.letters.length), attempt:[], usedIdx:new Set() };
}

function renderWheel(){
  const levels = currentWheelLevels();
  if(state.wheel.levelIndex >= levels.length) state.wheel.levelIndex = 0;
  const idx = state.wheel.levelIndex, lvl = levels[idx];
  if(!wheelRun) wheelRun = newWheelRun(idx);
  const st = wheelRun;
  const foundCount = st.found.size;

  app.innerHTML = stationHeader(`Word Wheel · ${state.tier}`) + tipBanner('wheel') + `
    <p class="subtitle">Level ${idx+1}/${levels.length} — ${foundCount===lvl.words.length ? 'all words found!' : foundCount+' of '+lvl.words.length+' words found'}</p>
    <div class="board" id="board"></div>
    <div class="attempt-row">
      <div class="attempt-tiles" id="attemptTiles"></div>
      <div class="msg" id="msg"></div>
      <div class="attempt-actions">
        <button class="pill-btn" id="clearBtn">Clear</button>
        <button class="pill-btn primary" id="checkBtn">Check word</button>
      </div>
    </div>
    <div class="wheel-wrap">
      <div class="wheel-bg"></div>
      <div id="wheelLetters"></div>
      <button class="wheel-center" id="shuffleBtn" title="Shuffle">⟲</button>
    </div>
    <div class="tools">
      <button class="pill-btn" id="hintBtn">💡 Hint (${st.hintsLeft})</button>
      <button class="pill-btn" id="skipBtn">Skip level ›</button>
    </div>
    <footer class="credit">Type on your keyboard, or tap the letters — Enter checks a word. Loops forever through this level's set.</footer>
  `;
  attachHeader();
  renderWheelBoard(); renderWheelLetters(); renderWheelAttempt();
  el('clearBtn').addEventListener('click', wheelClear);
  el('checkBtn').addEventListener('click', wheelCheck);
  el('shuffleBtn').addEventListener('click', ()=>{ st.wheelOrder = shuffledIndices(lvl.letters.length); renderWheelLetters(); });
  el('hintBtn').addEventListener('click', wheelHint);
  el('skipBtn').addEventListener('click', ()=> wheelAdvance(false));
}
function renderWheelBoard(){
  const levels = currentWheelLevels(), idx = state.wheel.levelIndex, lvl = levels[idx], st = wheelRun;
  const board = el('board'); board.innerHTML = '';
  lvl.words.forEach(word=>{
    const row = document.createElement('div');
    const isBonus = word.length === lvl.letters.length;
    row.className = 'word-row' + (st.found.has(word)?' solved':'') + (isBonus?' bonus':'');
    row.dataset.word = word;
    const revealedSet = st.revealed[word] || new Set();
    for(let i=0;i<word.length;i++){
      const tile = document.createElement('div'); tile.className='tile';
      if(st.found.has(word)) tile.textContent = word[i];
      else if(revealedSet.has(i)){ tile.textContent = word[i]; tile.style.color='var(--forest-deep)'; tile.style.borderColor='var(--forest-mid)'; }
      row.appendChild(tile);
    }
    board.appendChild(row);
  });
}
function renderWheelLetters(){
  const levels = currentWheelLevels(), idx = state.wheel.levelIndex, lvl = levels[idx], st = wheelRun;
  const wrap = el('wheelLetters'); wrap.innerHTML = '';
  const n = lvl.letters.length, radius = 78;
  st.wheelOrder.forEach((letterIdx, posIdx)=>{
    const angle = (Math.PI/2) - posIdx*(2*Math.PI/n);
    const cx = 110 + radius*Math.cos(angle) - 23;
    const cy = 110 - radius*Math.sin(angle) - 23;
    const btn = document.createElement('div');
    btn.className = 'letter-tile' + (st.usedIdx.has(letterIdx)?' used':'');
    btn.style.left = cx+'px'; btn.style.top = cy+'px';
    btn.textContent = lvl.letters[letterIdx];
    btn.addEventListener('click', ()=> wheelPick(letterIdx));
    wrap.appendChild(btn);
  });
}
function renderWheelAttempt(){
  const st = wheelRun; const t = el('attemptTiles'); t.innerHTML='';
  st.attempt.forEach((item,i)=>{
    const d=document.createElement('div'); d.className='attempt-tile'; d.textContent=item.letter;
    d.addEventListener('click', ()=>{ st.usedIdx.delete(item.wheelIdx); st.attempt.splice(i,1); renderWheelLetters(); renderWheelAttempt(); });
    t.appendChild(d);
  });
}
function wheelPick(wheelIdx){
  const st = wheelRun; if(st.usedIdx.has(wheelIdx)) return;
  const lvl = currentWheelLevels()[state.wheel.levelIndex];
  st.usedIdx.add(wheelIdx);
  st.attempt.push({letter: lvl.letters[wheelIdx], wheelIdx});
  el('msg').textContent=''; renderWheelLetters(); renderWheelAttempt();
}
function wheelClear(){ const st=wheelRun; st.attempt=[]; st.usedIdx=new Set(); renderWheelLetters(); renderWheelAttempt(); }
function wheelFlash(text){ el('msg').textContent=text; setTimeout(()=>{ if(el('msg') && el('msg').textContent===text) el('msg').textContent=''; },1400); }

function wheelCheck(){
  const levels = currentWheelLevels(), idx = state.wheel.levelIndex, lvl = levels[idx], st = wheelRun;
  const word = st.attempt.map(a=>a.letter).join('');
  if(word.length<3){ wheelFlash(word.length===0?'Pick some letters first':'Words need 3+ letters'); wheelClear(); return; }
  if(!lvl.words.includes(word)){ wheelFlash(`"${word}" isn't in this level`); wheelClear(); return; }
  if(st.found.has(word)){ wheelFlash(`Already found "${word}"`); wheelClear(); return; }
  st.found.add(word);
  const isBonus = word.length===lvl.letters.length;
  const gained = word.length*10*(isBonus?2:1);
  st.pointsEarned += gained; addXP('wheel', gained);
  wheelClear(); renderWheelBoard();
  const row = document.querySelector(`.word-row[data-word="${word}"]`);
  if(row) row.querySelectorAll('.tile').forEach(t=>t.classList.add('pop'));
  const foundCount = st.found.size;
  document.querySelector('.subtitle').textContent = `Level ${idx+1}/${levels.length} — ${foundCount===lvl.words.length ? 'all words found!' : foundCount+' of '+lvl.words.length+' words found'}`;
  if(foundCount===lvl.words.length) setTimeout(()=>{ if(state.screen==='wheel') wheelAdvance(true); }, 500);
}
function wheelAdvance(cleared){
  const levels = currentWheelLevels();
  if(cleared) showToast('🌳 Level cleared! +'+wheelRun.pointsEarned+' XP');
  state.wheel.levelIndex = (state.wheel.levelIndex + 1) % levels.length;
  if(state.wheel.levelIndex === 0 && cleared) showToast("🔁 New round — looping back with a fresh shuffle!");
  wheelRun = newWheelRun(state.wheel.levelIndex);
  render();
}
function wheelHint(){
  const levels = currentWheelLevels(), idx=state.wheel.levelIndex, lvl=levels[idx], st=wheelRun;
  if(st.hintsLeft===0) return;
  const unsolved = lvl.words.filter(w=>!st.found.has(w));
  if(!unsolved.length) return;
  const word = unsolved[Math.floor(Math.random()*unsolved.length)];
  if(!st.revealed[word]) st.revealed[word]=new Set();
  const missing=[...Array(word.length).keys()].filter(i=>!st.revealed[word].has(i));
  if(!missing.length) return;
  const pos = missing[Math.floor(Math.random()*missing.length)];
  st.revealed[word].add(pos); st.hintsLeft--; st.hintsUsed++;
  if(st.revealed[word].size===word.length) st.found.add(word);
  el('hintBtn').textContent = `💡 Hint (${st.hintsLeft})`;
  renderWheelBoard();
  const foundCount=st.found.size;
  document.querySelector('.subtitle').textContent = `Level ${idx+1}/${levels.length} — ${foundCount===lvl.words.length ? 'all words found!' : foundCount+' of '+lvl.words.length+' words found'}`;
  if(foundCount===lvl.words.length) setTimeout(()=>{ if(state.screen==='wheel') wheelAdvance(true); }, 450);
}

/* =========================================================
   2) GRAMMAR GAUNTLET (tiered, endless)
========================================================= */
const GRAMMAR = [
 {tier:'Beginner', q:"She ___ to the gym every morning.", options:["go","goes","going","gone"], correct:1, explain:"Third person singular ('she') needs -s in the present simple: she goes."},
 {tier:'Beginner', q:"They ___ watching a movie when I called.", options:["was","were","is","are"], correct:1, explain:"'They' is plural, so the past continuous uses 'were'."},
 {tier:'Beginner', q:"This is ___ best coffee I've ever had.", options:["a","an","the","—"], correct:2, explain:"Superlative forms ('best') always take 'the'."},
 {tier:'Beginner', q:"She is ___ than her sister.", options:["tall","taller","tallest","more tall"], correct:1, explain:"Short adjectives (one syllable) form comparatives with -er: tall → taller."},
 {tier:'Beginner', q:"Look! It ___ outside.", options:["rain","rains","is raining","rained"], correct:2, explain:"Present continuous describes an action happening right now."},
 {tier:'Beginner', q:"There ___ some milk in the fridge.", options:["is","are","were","be"], correct:0, explain:"'Milk' is uncountable, so it takes the singular verb 'is'."},
 {tier:'Beginner', q:"You should ___ your homework before you play.", options:["do","doing","to do","did"], correct:0, explain:"After modal verbs like 'should', use the base form of the verb."},
 {tier:'Beginner', q:"My brother ___ two dogs.", options:["have","has","having","had"], correct:1, explain:"Third person singular: he/she/it has."},
 {tier:'Beginner', q:"___ is your name?", options:["What","Who","Where","When"], correct:0, explain:"'What' asks for a thing or a piece of information like a name."},
 {tier:'Beginner', q:"We ___ students.", options:["is","am","are","be"], correct:2, explain:"'We' takes the plural form of 'be': are."},
 {tier:'Beginner', q:"I ___ TV right now.", options:["watch","watches","am watching","watched"], correct:2, explain:"'Right now' signals the present continuous."},
 {tier:'Beginner', q:"This is ___ apple.", options:["a","an","the","—"], correct:1, explain:"Use 'an' before a word that starts with a vowel sound."},
 {tier:'Intermediate', q:"I have lived here ___ 2015.", options:["since","for","from","at"], correct:0, explain:"'Since' introduces a specific starting point in time; 'for' would introduce a duration."},
 {tier:'Intermediate', q:"If it rains tomorrow, we ___ the picnic.", options:["cancel","canceled","will cancel","would cancel"], correct:2, explain:"First conditional: if + present simple, ... will + base verb."},
 {tier:'Intermediate', q:"___ you ever been to Japan?", options:["Did","Do","Have","Has"], correct:2, explain:"'Have you ever...?' asks about a life experience — present perfect."},
 {tier:'Intermediate', q:"I'm interested ___ learning French.", options:["on","in","at","for"], correct:1, explain:"'Interested in' is the fixed preposition pairing."},
 {tier:'Intermediate', q:"This book belongs ___ me.", options:["of","to","for","at"], correct:1, explain:"'Belong to' is a fixed preposition pairing."},
 {tier:'Intermediate', q:"By the time we arrived, the movie ___ already started.", options:["has","had","have","was"], correct:1, explain:"Past perfect shows an action completed before another past action (our arrival)."},
 {tier:'Intermediate', q:"She's been working here ___ three years.", options:["since","for","from","at"], correct:1, explain:"'For' introduces a duration of time."},
 {tier:'Intermediate', q:"I wish I ___ more time to study.", options:["have","had","having","has"], correct:1, explain:"'Wish' + past simple expresses a present wish that isn't true."},
 {tier:'Intermediate', q:"He asked me where I ___ from.", options:["am","was","were","is"], correct:1, explain:"Reported speech shifts present tense back one step: am → was."},
 {tier:'Intermediate', q:"The homework must ___ finished by Friday.", options:["be","being","been","is"], correct:0, explain:"Passive with a modal: must + be + past participle."},
 {tier:'Advanced', q:"He ___ his homework before dinner yesterday.", options:["finish","finished","had finished","has finished"], correct:2, explain:"Past perfect shows an action completed before another past action (dinner)."},
 {tier:'Advanced', q:"She speaks English ___ than I do.", options:["good","well","better","best"], correct:2, explain:"The adverb 'well' becomes 'better' in the comparative."},
 {tier:'Advanced', q:"We ___ dinner when the power went out.", options:["cook","cooked","were cooking","have cooked"], correct:2, explain:"Past continuous for an action in progress when something else interrupted it."},
 {tier:'Advanced', q:"Not only ___ late, but he also forgot his notes.", options:["he was","was he","he is","is he"], correct:1, explain:"'Not only' at the start of a clause triggers inversion: was he."},
 {tier:'Advanced', q:"I'd rather you ___ that now.", options:["don't","didn't","not do","won't"], correct:1, explain:"'I'd rather you' + past simple expresses a present preference about someone else's action."},
 {tier:'Advanced', q:"Hardly ___ the show started when the lights went out.", options:["had","has","did","was"], correct:0, explain:"'Hardly had... when' is a past-perfect inversion structure."},
 {tier:'Advanced', q:"She speaks as if she ___ everything.", options:["knows","knew","has known","know"], correct:1, explain:"'As if' + past simple expresses a hypothetical present."},
 {tier:'Advanced', q:"It's high time we ___ this project.", options:["finish","finished","will finish","are finishing"], correct:1, explain:"'It's (high) time' + past simple expresses something overdue now."},
];

function grammarPool(){ return GRAMMAR.filter(g=>g.tier===state.tier); }

function renderGrammar(){
  const g = state.grammar;
  if(g.tier !== state.tier || !g.order.length || g.qIndex >= g.order.length){
    g.order = shuffle([...Array(grammarPool().length).keys()]); g.qIndex = 0; g.tier = state.tier;
  }
  app.innerHTML = stationHeader(`Grammar Gauntlet · ${state.tier}`) + tipBanner('grammar') + `
    <div class="quiz-progress" id="qprog"></div>
    <div class="quiz-card" id="qcard"></div>
    <div class="quiz-footer"><button class="pill-btn primary" id="nextQBtn" disabled>Next question</button></div>
  `;
  attachHeader();
  renderGrammarProgress(); renderGrammarCard();
  el('nextQBtn').addEventListener('click', grammarNext);
}
function renderGrammarProgress(){
  const g = state.grammar, pool = grammarPool();
  el('qprog').innerHTML = pool.map((_,i)=> `<div class="seg ${i<g.qIndex?'done':(i===g.qIndex?'current':'')}"></div>`).join('');
}
function renderGrammarCard(){
  const g = state.grammar, pool = grammarPool(), item = pool[g.order[g.qIndex]];
  el('qcard').innerHTML = `
    <p class="qtext">${item.q}</p>
    <div class="options">${item.options.map((opt,i)=>`<button class="option-btn" data-i="${i}">${opt}</button>`).join('')}</div>
    <div class="explain" id="explainBox">${item.explain}</div>
  `;
  document.querySelectorAll('.option-btn').forEach(btn=> btn.addEventListener('click', ()=> grammarAnswer(parseInt(btn.dataset.i))));
}
function grammarAnswer(i){
  const g = state.grammar, pool = grammarPool(), item = pool[g.order[g.qIndex]];
  if(el('nextQBtn').disabled === false) return; // already answered
  document.querySelectorAll('.option-btn').forEach((btn,idx)=>{
    btn.disabled = true;
    if(idx===item.correct) btn.classList.add('correct');
    else if(idx===i) btn.classList.add('wrong');
  });
  if(i===item.correct) addXP('grammar', 10);
  el('explainBox').classList.add('show');
  el('nextQBtn').disabled = false;
}
function grammarNext(){
  const g = state.grammar, pool = grammarPool();
  g.qIndex++;
  if(g.qIndex >= pool.length){
    showToast('🔁 New round of grammar questions!');
    g.order = shuffle([...Array(pool.length).keys()]); g.qIndex = 0;
  }
  renderGrammarProgress(); renderGrammarCard();
  el('nextQBtn').disabled = true;
}

/* =========================================================
   3) SENTENCE SCRAMBLE (tiered, endless)
========================================================= */
const SCRAMBLE = [
 {tier:'Beginner', sentence:"Would you like some coffee?"},
 {tier:'Beginner', sentence:"He didn't go to school yesterday."},
 {tier:'Beginner', sentence:"They are going to visit their grandmother."},
 {tier:'Beginner', sentence:"The keys are on the table."},
 {tier:'Beginner', sentence:"My father works in a bank."},
 {tier:'Beginner', sentence:"We are watching a film tonight."},
 {tier:'Beginner', sentence:"Can you help me please?"},
 {tier:'Intermediate', sentence:"She has lived here for ten years."},
 {tier:'Intermediate', sentence:"I haven't finished my homework yet."},
 {tier:'Intermediate', sentence:"She has never been abroad."},
 {tier:'Intermediate', sentence:"I have already eaten breakfast."},
 {tier:'Intermediate', sentence:"He was reading when the phone rang."},
 {tier:'Advanced', sentence:"If I were you I would apologize."},
 {tier:'Advanced', sentence:"Had I known, I would have called you."},
 {tier:'Advanced', sentence:"No sooner had we left than it started raining."},
].map(s => ({...s, words: s.sentence.split(' ')}));

function scramblePool(){ return SCRAMBLE.filter(s=>s.tier===state.tier); }

function renderScramble(){
  const s = state.scramble, pool = scramblePool();
  if(s.tier !== state.tier || !s.order || !s.order.length || s.sIndex >= s.order.length){
    s.order = shuffle([...Array(pool.length).keys()]); s.sIndex = 0; s.tier = state.tier;
  }
  setupScrambleRound();
  app.innerHTML = stationHeader(`Sentence Scramble · ${state.tier}`) + tipBanner('scramble') + `
    <div class="quiz-progress" id="qprog"></div>
    <p class="subtitle">Tap the words in the right order to build the sentence.</p>
    <div class="scramble-target empty" id="scrambleTarget"></div>
    <div class="pool-wrap" id="scramblePool"></div>
    <div class="msg" id="msg"></div>
    <div class="scramble-actions">
      <button class="pill-btn" id="undoBtn">Undo</button>
      <button class="pill-btn primary" id="checkScrambleBtn">Check sentence</button>
    </div>
  `;
  attachHeader();
  el('qprog').innerHTML = pool.map((_,i)=> `<div class="seg ${i<s.sIndex?'done':(i===s.sIndex?'current':'')}"></div>`).join('');
  renderScrambleRound();
  el('undoBtn').addEventListener('click', scrambleUndo);
  el('checkScrambleBtn').addEventListener('click', scrambleCheck);
}
function setupScrambleRound(){
  const s = state.scramble, pool = scramblePool(), item = pool[s.order[s.sIndex]];
  s.answer = [];
  s.pool = item.words.map((w,i)=>({word:w, id:i})).sort(()=>Math.random()-0.5);
}
function renderScrambleRound(){
  const target = el('scrambleTarget'), poolEl = el('scramblePool'), s = state.scramble;
  target.classList.toggle('empty', s.answer.length===0);
  target.innerHTML = s.answer.map((item,i)=> `<div class="chip answer" data-i="${i}">${item.word}</div>`).join('');
  poolEl.innerHTML = s.pool.map(item => `<div class="chip pool" data-id="${item.id}">${item.word}</div>`).join('');
  target.querySelectorAll('.chip.answer').forEach(chip=>{
    chip.addEventListener('click', ()=>{ const i=parseInt(chip.dataset.i); s.pool.push(s.answer[i]); s.answer.splice(i,1); renderScrambleRound(); });
  });
  poolEl.querySelectorAll('.chip.pool').forEach(chip=>{
    chip.addEventListener('click', ()=>{ const id=parseInt(chip.dataset.id); const pi=s.pool.findIndex(p=>p.id===id); s.answer.push(s.pool[pi]); s.pool.splice(pi,1); renderScrambleRound(); });
  });
}
function scrambleUndo(){ const s=state.scramble; if(!s.answer.length) return; s.pool.push(s.answer.pop()); renderScrambleRound(); }
function scrambleFlash(text){ el('msg').textContent=text; setTimeout(()=>{ if(el('msg') && el('msg').textContent===text) el('msg').textContent=''; },1300); }
function scrambleCheck(){
  const s = state.scramble, pool = scramblePool(), item = pool[s.order[s.sIndex]];
  const built = s.answer.map(a=>a.word).join(' ');
  if(s.answer.length < item.words.length){ scrambleFlash('Use all the words first'); return; }
  if(built === item.sentence){
    addXP('scramble', 15);
    scrambleFlash('Correct! ✔');
    setTimeout(()=>{ if(state.screen==='scramble') scrambleNext(); }, 700);
  } else {
    scrambleFlash('Not quite — check the word order');
    el('scrambleTarget').classList.add('shake');
    setTimeout(()=> el('scrambleTarget') && el('scrambleTarget').classList.remove('shake'), 350);
  }
}
function scrambleNext(){
  const s = state.scramble, pool = scramblePool();
  s.sIndex++;
  if(s.sIndex >= pool.length){ showToast('🔁 New round of sentences!'); s.order = shuffle([...Array(pool.length).keys()]); s.sIndex = 0; }
  renderScramble();
}

/* =========================================================
   4) SYNONYM MATCH (tiered, endless replay)
========================================================= */
const SYN_PAIRS_BY_TIER = {
  Beginner: [["HAPPY","GLAD"], ["BIG","HUGE"], ["FAST","QUICK"], ["SAD","UNHAPPY"], ["SMALL","LITTLE"], ["EASY","SIMPLE"]],
  Intermediate: [["SMART","CLEVER"], ["SCARED","AFRAID"], ["TIRED","EXHAUSTED"], ["ANGRY","FURIOUS"], ["BRAVE","COURAGEOUS"], ["POLITE","COURTEOUS"]],
  Advanced: [["ARDUOUS","DIFFICULT"], ["CANDID","HONEST"], ["ELOQUENT","ARTICULATE"], ["FRUGAL","THRIFTY"], ["OBSTINATE","STUBBORN"], ["METICULOUS","CAREFUL"]],
};

function setupMatch(){
  const pairs = SYN_PAIRS_BY_TIER[state.tier];
  const cards = [];
  pairs.forEach((pair,pi)=>{ cards.push({text:pair[0], pairId:pi}); cards.push({text:pair[1], pairId:pi}); });
  cards.sort(()=>Math.random()-0.5);
  cards.forEach((c,i)=> c.id=i);
  state.match = { cards, flipped:[], matched:new Set(), moves:0 };
}
function renderMatch(){
  if(!state.match.cards.length) setupMatch();
  app.innerHTML = stationHeader(`Synonym Match · ${state.tier}`) + tipBanner('match') + `
    <p class="subtitle">Flip two cards. Find words that mean the same thing.</p>
    <div class="match-stats"><span id="movesCount">Moves: 0</span><span id="pairsCount">Pairs: 0/${SYN_PAIRS_BY_TIER[state.tier].length}</span></div>
    <div class="memory-grid" id="memoryGrid"></div>
    <div class="scramble-actions" style="margin-top:16px;">
      <button class="pill-btn" id="resetMatchBtn">Shuffle & restart</button>
    </div>
  `;
  attachHeader(); renderMemoryGrid();
  el('resetMatchBtn').addEventListener('click', ()=>{ setupMatch(); renderMatch(); });
}
function renderMemoryGrid(){
  const grid = el('memoryGrid'), m = state.match;
  grid.innerHTML = m.cards.map(c=>{
    const isFlipped = m.flipped.includes(c.id) || m.matched.has(c.pairId);
    const cls = 'memory-card' + (m.matched.has(c.pairId) ? ' matched' : (isFlipped ? ' flipped' : ''));
    return `<div class="${cls}" data-id="${c.id}">${isFlipped ? c.text : '?'}</div>`;
  }).join('');
  el('movesCount').textContent = `Moves: ${m.moves}`;
  el('pairsCount').textContent = `Pairs: ${m.matched.size}/${SYN_PAIRS_BY_TIER[state.tier].length}`;
  grid.querySelectorAll('.memory-card').forEach(cardEl=> cardEl.addEventListener('click', ()=> matchFlip(parseInt(cardEl.dataset.id))));
}
function matchFlip(id){
  const m = state.match;
  if(m.flipped.length>=2) return;
  const card = m.cards.find(c=>c.id===id);
  if(m.matched.has(card.pairId) || m.flipped.includes(id)) return;
  m.flipped.push(id); renderMemoryGrid();
  if(m.flipped.length===2){
    m.moves++;
    const [a,b] = m.flipped.map(fid => m.cards.find(c=>c.id===fid));
    if(a.pairId===b.pairId){
      m.matched.add(a.pairId); m.flipped = [];
      addXP('match', 15);
      renderMemoryGrid();
      if(m.matched.size === SYN_PAIRS_BY_TIER[state.tier].length){
        showToast('🃏 All paired! Reshuffling for another round...');
        setTimeout(()=>{ if(state.screen==='match'){ setupMatch(); renderMatch(); } }, 1200);
      }
    } else {
      setTimeout(()=>{ m.flipped.forEach(fid=>{ const de=document.querySelector(`.memory-card[data-id="${fid}"]`); if(de) de.classList.add('wrong'); }); }, 50);
      setTimeout(()=>{ m.flipped=[]; renderMemoryGrid(); }, 700);
    }
  }
}

function recallRate(knewIt){
  const r = state.recall;
  const idx = r.queue.shift();
  if(knewIt){
    r.mastered++; addXP('recall', 5);
    r.queue.push(idx); // requeue near the back for long-term reinforcement
  } else {
    const insertAt = Math.min(2, r.queue.length);
    r.queue.splice(insertAt, 0, idx); // resurface sooner
  }
  if(r.mastered>0 && r.mastered % 5 === 0) showToast(`🧠 ${r.mastered} words mastered this session!`);
  renderRecall();
}

function iconFor(word){ return ICON_MAP[word.toLowerCase()] || null; }


function setupGroupsRound(){
  const allCats = GROUPS_BY_TIER[state.tier];
  const chosenIdx = shuffle([...Array(allCats.length).keys()]).slice(0,3);
  const cats = chosenIdx.map(i => ({name: allCats[i].name, target: allCats[i].words.length, collected: 0}));
  let pool = [];
  chosenIdx.forEach((catI, slot) => {
    allCats[catI].words.forEach((w, wi) => pool.push({id: slot+'-'+wi, word: w, catIndex: slot}));
  });
  pool = shuffle(pool);
  state.groups = { tier: state.tier, cats, pool, selectedId: null, moves: 0 };
}

function renderGroups(){
  const g = state.groups;
  if(g.tier !== state.tier || !g.cats.length) setupGroupsRound();
  app.innerHTML = stationHeader(`Word Groups · ${state.tier}`) + tipBanner('groups') + `
    <p class="subtitle">Moves: ${g.moves} — sort every word into its group.</p>
    <div class="cat-row" id="catRow"></div>
    <div class="word-pool" id="wordPool"></div>
    <div class="scramble-actions">
      <button class="pill-btn" id="shuffleGroupsBtn">Shuffle words 🔀</button>
    </div>
  `;
  attachHeader();
  renderGroupsBoard();
  el('shuffleGroupsBtn').addEventListener('click', ()=>{ g.pool = shuffle(g.pool); renderGroupsBoard(); });
}
function renderGroupsBoard(){
  const g = state.groups;
  const catRow = el('catRow'), pool = el('wordPool');
  catRow.innerHTML = g.cats.map((c,i)=> `
    <div class="cat-btn ${g.selectedId!==null?'armed':''} ${c.collected>=c.target?'done':''}" data-cat="${i}">
      <div class="cat-name">${c.name}</div>
      <div class="cat-progress">${c.collected}/${c.target}</div>
    </div>
  `).join('');
  pool.innerHTML = g.pool.map(w => `
    <div class="word-card ${g.selectedId===w.id?'selected':''}" data-id="${w.id}">
      ${iconFor(w.word) ? `<img class="icon-img" src="${iconFor(w.word)}" alt="${w.word}">` : ''}${w.word}
    </div>
  `).join('');
  catRow.querySelectorAll('.cat-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> groupsCategoryClick(parseInt(btn.dataset.cat)));
  });
  pool.querySelectorAll('.word-card').forEach(card=>{
    card.addEventListener('click', ()=> groupsWordClick(card.dataset.id));
  });
}
function groupsWordClick(id){
  const g = state.groups;
  g.selectedId = (g.selectedId === id) ? null : id;
  renderGroupsBoard();
}
function groupsCategoryClick(catIdx){
  const g = state.groups;
  if(g.cats[catIdx].collected >= g.cats[catIdx].target) return;
  if(g.selectedId === null){ showToast('Tap a word first, then a category'); return; }
  const word = g.pool.find(w => w.id === g.selectedId);
  g.moves++;
  if(word.catIndex === catIdx){
    g.cats[catIdx].collected++;
    g.pool = g.pool.filter(w => w.id !== g.selectedId);
    g.selectedId = null;
    addXP('groups', 10);
    document.querySelector('.subtitle').textContent = `Moves: ${g.moves} — sort every word into its group.`;
    renderGroupsBoard();
    if(g.cats.every(c => c.collected >= c.target)){
      showToast('🗂️ Group cleared! Loading new categories...');
      setTimeout(()=>{ if(state.screen==='groups'){ setupGroupsRound(); renderGroups(); } }, 900);
    }
  } else {
    document.querySelector('.subtitle').textContent = `Moves: ${g.moves} — sort every word into its group.`;
    const btn = document.querySelector(`.cat-btn[data-cat="${catIdx}"]`);
    if(btn){ btn.classList.add('wrong-shake'); setTimeout(()=> btn && btn.classList.remove('wrong-shake'), 350); }
    showToast(`"${word.word}" doesn't belong there — try again`);
  }
}

/* =========================================================
   9) DAILY MIX (interleaved retrieval practice, endless)
   Pedagogy: interleaving (mixed skill types beat blocked practice),
   retrieval practice / the testing effect, and spaced repetition —
   a new deterministic mix each calendar day, same items all day.
========================================================= */
const DAILY_STEP_LABELS = ['Grammar', 'Sentence Order', 'Categories', 'Memory'];

function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}
function hashStr(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) >>> 0; }
  return h;
}
function seededPick(arr, seed, salt){
  const idx = (seed + salt*2654435761) >>> 0;
  return arr[idx % arr.length];
}

function setupDailyMix(){
  const today = todayStr();
  const dm = state.daily;
  if(dm.date === today && dm.tier === state.tier && dm.items) return; // same day, same tier — keep in-progress state
  const seed = hashStr(today + state.tier);
  const gPool = grammarPool();
  const gItem = seededPick(gPool, seed, 1);
  const sPool = scramblePool();
  const sItem = seededPick(sPool, seed, 2);
  const catsForTier = GROUPS_BY_TIER[state.tier];
  const catIdx = seededPick([...Array(catsForTier.length).keys()], seed, 3);
  const cat = catsForTier[catIdx];
  const wordList = cat.words;
  const wordEntry = seededPick(wordList, seed, 4);
  const word = Array.isArray(wordEntry) ? wordEntry[0] : wordEntry;
  const otherCats = catsForTier.filter((_,i)=>i!==catIdx);
  const distractor1 = seededPick(otherCats, seed, 5).name;
  const distractor2 = seededPick(otherCats, seed, 6).name;
  const catOptions = shuffle([cat.name, distractor1, distractor2].filter((v,i,a)=>a.indexOf(v)===i));
  const rPool = RECALL_WORDS[state.tier];
  const rItem = seededPick(rPool, seed, 7);

  state.daily = {
    date: today, tier: state.tier, stepIndex: 0,
    items: { grammar: gItem, scramble: sItem, catWord: word, catCorrect: cat.name, catOptions, recall: rItem },
    streak: dm.streak || 0, xpEarnedToday: 0,
    gAnswered:false, gSelected:null,
    scAnswer:[], scPool: sItem.words.map((w,i)=>({word:w,id:i})).sort(()=>Math.random()-0.5),
    catSelected:null, catAnswered:false,
    flipShown:false, done:false,
  };
}

function renderDaily(){
  setupDailyMix();
  const dm = state.daily;
  app.innerHTML = stationHeader(`Daily Mix · ${state.tier}`) + tipBanner('daily') + `
    <div class="streak-row"><span class="streak-pill">🔥 ${dm.streak} day streak</span></div>
    <div class="daily-progress" id="dailyProgress"></div>
    <div class="daily-label" id="dailyLabel"></div>
    <div id="dailyBody"></div>
  `;
  attachHeader();
  renderDailyProgress();
  renderDailyStep();
}
function renderDailyProgress(){
  const dm = state.daily;
  el('dailyProgress').innerHTML = DAILY_STEP_LABELS.map((_,i)=>
    `<div class="seg ${dm.done ? 'done' : (i<dm.stepIndex?'done':(i===dm.stepIndex?'current':''))}"></div>`).join('');
  el('dailyLabel').textContent = dm.done ? 'All done for today!' : `Step ${dm.stepIndex+1} of 4 — ${DAILY_STEP_LABELS[dm.stepIndex]}`;
}
function renderDailyStep(){
  const dm = state.daily;
  const body = el('dailyBody');
  if(dm.done){
    body.innerHTML = `
      <div class="daily-done">
        <div class="big-emoji">🎉</div>
        <p class="qtext" style="margin-bottom:6px;">Nice work — today's mix is complete!</p>
        <p class="subtitle">+${dm.xpEarnedToday} XP earned today. Come back tomorrow for a fresh mix.</p>
        <div class="scramble-actions" style="margin-top:16px;"><button class="pill-btn primary" id="dailyBackBtn">Back to trail</button></div>
      </div>`;
    el('dailyBackBtn').addEventListener('click', goHub);
    return;
  }
  if(dm.stepIndex===0) renderDailyGrammar();
  else if(dm.stepIndex===1) renderDailyScramble();
  else if(dm.stepIndex===2) renderDailyCategory();
  else renderDailyRecall();
}

function dailyAdvance(){
  const dm = state.daily;
  dm.stepIndex++;
  if(dm.stepIndex >= 4){
    dm.done = true;
    dm.streak += 1;
    showToast('🔥 Streak extended — see you tomorrow!');
    renderDaily(); // full re-render so the streak pill reflects the new count immediately
    return;
  }
  renderDailyProgress();
  renderDailyStep();
}

function renderDailyGrammar(){
  const dm = state.daily, item = dm.items.grammar;
  el('dailyBody').innerHTML = `
    <div class="quiz-card">
      <p class="qtext">${item.q}</p>
      <div class="options">${item.options.map((opt,i)=>`<button class="option-btn" data-i="${i}">${opt}</button>`).join('')}</div>
      <div class="explain" id="dExplain">${item.explain}</div>
    </div>
    <div class="quiz-footer"><button class="pill-btn primary" id="dNextBtn" disabled>Next</button></div>
  `;
  document.querySelectorAll('#dailyBody .option-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(dm.gAnswered) return;
      dm.gAnswered = true;
      const i = parseInt(btn.dataset.i);
      document.querySelectorAll('#dailyBody .option-btn').forEach((b,idx)=>{
        b.disabled = true;
        if(idx===item.correct) b.classList.add('correct'); else if(idx===i) b.classList.add('wrong');
      });
      if(i===item.correct){ addXP('daily', 10); dm.xpEarnedToday += 10; }
      el('dExplain').classList.add('show');
      el('dNextBtn').disabled = false;
    });
  });
  el('dNextBtn').addEventListener('click', dailyAdvance);
}

function renderDailyScramble(){
  const dm = state.daily, item = dm.items.scramble;
  el('dailyBody').innerHTML = `
    <p class="subtitle">Tap the words in the right order.</p>
    <div class="scramble-target empty" id="dTarget"></div>
    <div class="pool-wrap" id="dPool"></div>
    <div class="msg" id="dMsg"></div>
    <div class="scramble-actions">
      <button class="pill-btn" id="dUndoBtn">Undo</button>
      <button class="pill-btn primary" id="dCheckBtn">Check</button>
    </div>
  `;
  renderDailyScrambleUI();
  el('dUndoBtn').addEventListener('click', ()=>{ if(dm.scAnswer.length){ dm.scPool.push(dm.scAnswer.pop()); renderDailyScrambleUI(); } });
  el('dCheckBtn').addEventListener('click', ()=>{
    const built = dm.scAnswer.map(a=>a.word).join(' ');
    if(dm.scAnswer.length < item.words.length){ el('dMsg').textContent = 'Use all the words first'; return; }
    if(built === item.sentence){
      addXP('daily', 15); dm.xpEarnedToday += 15;
      el('dMsg').textContent = 'Correct! ✔';
      setTimeout(dailyAdvance, 700);
    } else {
      el('dMsg').textContent = 'Not quite — check the order';
    }
  });
}
function renderDailyScrambleUI(){
  const dm = state.daily;
  const target = el('dTarget'), pool = el('dPool');
  target.classList.toggle('empty', dm.scAnswer.length===0);
  target.innerHTML = dm.scAnswer.map((item,i)=>`<div class="chip answer" data-i="${i}">${item.word}</div>`).join('');
  pool.innerHTML = dm.scPool.map(item=>`<div class="chip pool" data-id="${item.id}">${item.word}</div>`).join('');
  target.querySelectorAll('.chip.answer').forEach(chip=>{
    chip.addEventListener('click', ()=>{ const i=parseInt(chip.dataset.i); dm.scPool.push(dm.scAnswer[i]); dm.scAnswer.splice(i,1); renderDailyScrambleUI(); });
  });
  pool.querySelectorAll('.chip.pool').forEach(chip=>{
    chip.addEventListener('click', ()=>{ const id=parseInt(chip.dataset.id); const pi=dm.scPool.findIndex(p=>p.id===id); dm.scAnswer.push(dm.scPool[pi]); dm.scPool.splice(pi,1); renderDailyScrambleUI(); });
  });
}

function renderDailyCategory(){
  const dm = state.daily;
  el('dailyBody').innerHTML = `
    <div class="quiz-card">
      <p class="qtext">Which group does &ldquo;${dm.items.catWord}&rdquo; belong to?</p>
      <div class="options">${dm.items.catOptions.map((opt,i)=>`<button class="option-btn" data-opt="${opt}">${opt}</button>`).join('')}</div>
    </div>
    <div class="quiz-footer"><button class="pill-btn primary" id="dNextBtn" disabled>Next</button></div>
  `;
  document.querySelectorAll('#dailyBody .option-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(dm.catAnswered) return;
      dm.catAnswered = true;
      const chosen = btn.dataset.opt;
      document.querySelectorAll('#dailyBody .option-btn').forEach(b=>{
        b.disabled = true;
        if(b.dataset.opt===dm.items.catCorrect) b.classList.add('correct');
        else if(b.dataset.opt===chosen) b.classList.add('wrong');
      });
      if(chosen===dm.items.catCorrect){ addXP('daily', 10); dm.xpEarnedToday += 10; }
      el('dNextBtn').disabled = false;
    });
  });
  el('dNextBtn').addEventListener('click', dailyAdvance);
}

function renderDailyRecall(){
  const dm = state.daily, [word, def] = dm.items.recall;
  const icon = iconFor(word);
  el('dailyBody').innerHTML = `
    <div class="flashcard">
      ${icon ? `<img class="icon-img-big" src="${icon}" alt="${word}">` : ''}
      <div class="word">${word}</div>
      <div class="def" id="dDef">${def}</div>
    </div>
    <div class="scramble-actions" id="dFlipRow">
      <button class="pill-btn primary" id="dFlipBtn">Show meaning</button>
    </div>
  `;
  el('dFlipBtn').addEventListener('click', ()=>{
    el('dDef').classList.add('show');
    el('dFlipRow').innerHTML = `<button class="pill-btn primary" id="dFinishBtn">Got it — finish today's mix</button>`;
    el('dFinishBtn').addEventListener('click', ()=>{ addXP('daily', 5); dm.xpEarnedToday += 5; dailyAdvance(); });
  });
}

/* =========================================================
   ROUTER
========================================================= */
function render(){
  if(state.screen==='hub') renderHub();
  else if(state.screen==='wheel'){ wheelRun=null; renderWheel(); }
  else if(state.screen==='grammar') renderGrammar();
  else if(state.screen==='scramble') renderScramble();
  else if(state.screen==='match'){ state.match.cards=[]; renderMatch(); }
  else if(state.screen==='describe'){ state.describe.scene=null; renderDescribe(); }
  else if(state.screen==='recall'){ state.recall.queue=[]; renderRecall(); }
  else if(state.screen==='reading'){ state.reading={pIndex:0, answers:[null,null,null], checked:false}; renderReading(); }
  else if(state.screen==='groups'){ state.groups.cats=[]; renderGroups(); }
  else if(state.screen==='daily'){ renderDaily(); }
}

document.addEventListener('keydown', (e)=>{
  if(state.screen==='wheel' && wheelRun){
    if(e.key==='Enter'){ wheelCheck(); return; }
    if(e.key==='Backspace'){ const st=wheelRun; if(st.attempt.length){ const item=st.attempt.pop(); st.usedIdx.delete(item.wheelIdx); renderWheelLetters(); renderWheelAttempt(); } return; }
    if(e.key==='Escape'){ wheelClear(); return; }
    const letter = e.key.toUpperCase();
    if(letter.length===1 && letter>='A' && letter<='Z'){
      const lvl = currentWheelLevels()[state.wheel.levelIndex];
      const idx = lvl.letters.split('').findIndex((ch,i)=> ch===letter && !wheelRun.usedIdx.has(i));
      if(idx!==-1) wheelPick(idx);
    }
  }
});

render();
</script>
